trigger: none
pr: none

resources:
  webhooks:
    - webhook: IssueUpdateWebHook
      connection: TestWebHookConnect

pool:
  vmImage: ubuntu-latest

parameters:
  - name: IssueUpdateWebHook
    type: object
    default: {}

variables:
  Question: ${{ parameters.IssueUpdateWebHook.resource.revision.fields['System.Description'] }}
  WorkItemID: ${{ parameters.IssueUpdateWebHook.resource.workItemId }}

steps:

- pwsh: |
    Write-Host "Pipeline Start"
    Write-Host "WorkItemID=$(WorkItemID)"
    Write-Host "Question=$(Question)"
    Write-Host "Pipeline End"
  displayName: 'Debug WebHook Data'

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.9'
  displayName: 'Use Python 3.9'

- bash: |
    pip install requests
  displayName: 'Install Python Dependencies'

- bash: |
    python ai_analyzer.py
  displayName: 'Analyze Issue Text'
  env:
    WORK_ITEM_ID: $(WorkItemID)
    QUESTION: $(Question)
    AI_API_URL: https://devtoolbox-api.devtoolbox-api.workers.dev/ai/generate

- bash: |
    python comment_handler.py
  displayName: 'Add Comment To Issue'
  env:
    WORK_ITEM_ID: $(WorkItemID)
    HAS_CHINESE: $(HasChinese)
    CHINESE_TEXT: $(ChineseText)
    RECOMMENDATION_BACKGROUND: $(RecommendationBackground)
    RECOMMENDATION_QUESTION_CONTENT: $(RecommendationQuestionContent)
    RECOMMENDATION_PROPOSAL: $(RecommendationProposal)
    SYSTEM_COLLECTION_URI: $(System.CollectionUri)
    SYSTEM_TEAM_PROJECT: $(System.TeamProject)
    SYSTEM_ACCESS_TOKEN: $(System.AccessToken)