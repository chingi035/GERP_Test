# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

resources:
  webhooks:
    - webhook: IssueUpdateWebHook
      connection: TestWebHookConnect

pool:
  vmImage: ubuntu-latest

parameters:
  - name: IssueUpdateWebHook
    type: object
    default: {}

steps:
- script: |
    echo Pipeline Start.
    echo ---------------------
    echo "$ {{ parameters.IssueUpdateWebHook }} "
    echo Pipeline End
  displayName: 'Run a multi-line script'
